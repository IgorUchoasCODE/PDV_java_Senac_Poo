ia.nota.pagamento_insuficiente=O valor total dos pagamentos (R$ %s) e inferior ao total dos produtos da nota (R$ %s). Faltam R$ %s.
ia.nota.troco_calculado=Pagamento em dinheiro recebido com excedente: Troco a devolver = R$ %s.
ia.nota.troco_apenas_dinheiro=O valor pago (R$ %s) excede o total da nota (R$ %s), mas troco so e permitido para pagamentos em DINHEIRO. Ajuste os valores dos pagamentos eletronicos.
ia.nota.estoque_insuficiente=Estoque insuficiente para o produto '%s' (#%d): solicitado %s %s, mas ha apenas %s %s disponivel em estoque.
ia.nota.limite_credito_excedido=A venda a prazo de R$ %s excede o limite de credito disponivel do cliente '%s' (Limite atual: R$ %s).

