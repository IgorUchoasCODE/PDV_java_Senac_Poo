# ==============================================================================
ia.erro.conjunto.sem_componentes=O conjunto '%s' precisa conter ao menos um componente com proporcao definida (ex: ++ #Componente[ nm> Item, q> 1 ]).
ia.erro.conjunto.proporcao_invalida=A quantidade ou proporcao '%s' do componente '%s' e invalida. Informe um valor numerico positivo.
ia.erro.conjunto.ciclo_recursivo=Nao e permitido adicionar o produto '%s' como componente dele mesmo (referencia ciclica bloqueada).
ia.erro.conjunto.componente_nao_encontrado=Nao encontrei o produto componente '%s' para inclusao no conjunto '%s'.
ia.erro.conjunto.duplicado=Ja existe um conjunto/kit cadastrado com o nome '%s' na unidade %s.

