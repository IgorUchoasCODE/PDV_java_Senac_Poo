# TEMPLATES DA BANDEJA DE CONTEXTO
# ==============================================================================
ia.msg.bandeja.vazia=Voce nao tem nenhuma alteracao aguardando confirmacao no momento.
ia.msg.bandeja.cabecalho=Aqui esta o resumo do que preparei para voce revisar (%d %s):
ia.msg.bandeja.pergunta=Deseja confirmar e aplicar %s agora? Digite SIM para confirmar ou NAO para descartar.
ia.msg.bandeja.dica=Observacao: voce continua com %d instrucao(oes) de cadastro ou alteracao aguardando confirmacao na bandeja.
ia.msg.bandeja.limpa=Todas as instrucoes em espera foram canceladas e a bandeja foi limpa.

# ==============================================================================
# TRATAMENTO PADRONIZADO DE ERROS E VALIDACOES CRUD
# ==============================================================================
ia.msg.erro.generico=Nao consegui concluir essa solicitacao agora. Verifique os dados informados e tente novamente.
ia.erro.dsl.vazio=Digite a instrucao apos $$. Exemplo: $$ C= #Produto, nm> Ovo, vl> 20, um> UN
ia.erro.operacao.desconhecida=Operacao '%s' nao reconhecida. Use C= (criar), R= (consultar), U= (atualizar), D= (excluir) ou abrir>janela>Acao>Alvo.
ia.erro.entidade.desconhecida=Entidade '#%s' nao reconhecida. Entidades suportadas: #Produto, #ProdutoFisico, #ProdutoDigital, #ConjuntoProduto, #Um, #Estoque, #Item, #Pessoa, #Cliente, #Fornecedor, #PessoaFisica, #PessoaJuridica, #Contato, #Registro, #FormaPagamento, #Pagamento, #PagamentoAVista, #PagamentoAPrazo, #PagamentoParcelado, #Nota, #NotaCompra, #NotaVenda, #NotaDevolucao, #NotaPerda, #NotaPagamento, #ParcelaPagamento.
ia.erro.campo.obrigatorio=Nao foi possivel preparar a operacao em %s: informe o campo obrigatorio '%s' (exemplo: %s).
ia.erro.valor.numerico=O valor '%s' informado no campo '%s' e invalido. Informe um numero valido (ex: 25.90).
ia.erro.produto.nao_encontrado=Nao encontrei nenhum produto correspondente a '%s'.
ia.erro.pessoa.nao_encontrada=Nao encontrei nenhuma pessoa correspondente a '%s'.
ia.erro.contato.nao_encontrado=Nao encontrei nenhum contato ou registro correspondente a '%s'.
ia.erro.nota.nao_encontrada=Nota #%s nao encontrada.
ia.erro.pagamento.nao_encontrado=Nenhum pagamento ou forma de pagamento encontrado para '%s'.
ia.erro.instrucao.nao_encontrada=Nao encontrei a instrucao %s na lista de espera.
ia.erro.atualizacao.sem_campos=Registro localizado (%s), mas nenhum novo valor foi informado para atualizar (ex: vv>, novo_nm>, dim>, val>).
ia.erro.registro.trancado=Operacao bloqueada: o registro #%s (%s) esta trancado pela sessao '%s' e nao pode ter seu estado alterado agora (apenas consultas R= sao permitidas).
ia.erro.exclusao.estoque_positivo=Exclusao bloqueada preventivamente:\n  O produto #%d - %s ainda possui %s %s em estoque.\n  So e permitido excluir produtos com estoque zerado.\n  Para dar baixa no estoque como perda (isentando o fornecedor) e excluir em seguida, envie:\n  $$ D= #Produto id> %d, -- #NotaPerda[ q> %s, resp> isento, mot> Baixa para exclusao ];

