ia.ui.janela.aberta=Janela JavaFX preparada: [%s] %s (Modulo: %s, FXML: %s, Rota: %s)%s
ia.ui.janela.nao_mapeada=Janela '%s' nao encontrada no catalogo grafico. Exemplos: abrir>janela>Registrar>nota, abrir>janela>Cadastrar>produto, abrir>janela>Cadastrar>pessoa, abrir>janela>Consultar>estoque, abrir>janela>Financeiro>pagamento.
